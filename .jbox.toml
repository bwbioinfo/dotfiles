# Generated by `jbox init`. This primary repository is the workspace.
version = 1

[runtime]
backend = "kata"

[resources]
cpus = 8
memory = "16G"
disk = "40G" # Recorded for future VM disk sizing, not enforced by Docker/Kata yet.
ttl = "24h"

[image]
dockerfile = ".jbox/Dockerfile"

[workspace]
mount = "/workspace/project"

[network]
internet = true
host = false
lan = false

[jcode]
persistent_credentials = true
# These project defaults override the host Jcode client for jbox sessions.
# Remove an option to inherit that value from the host Jcode client instead.
default_provider = "openai"
default_model = "gpt-5.6-terra"
openai_reasoning_effort = "high"
openai_service_tier = "off"

[[jcode.skills]]
# `gh skill install` runs inside the guest after GitHub CLI authentication.
# Omit `skill` to install every discoverable skill in this repository.
repository = "bwbioinfo/skills"
# skill = "scanpy"
# pin = "v1.2.3"
# allow_hidden_dirs = true

[jcode.agent]
# Session-wide guidance is mounted as ~/AGENTS.md, not written to the worktree.
instructions = """
Use the `work-with-geonic` skill for all work in this workspace.
Use the `jbox` skill for workspace, lifecycle, isolation, or credential tasks.
Use the `jcode` skill for Jcode configuration, remote sessions, and authentication.
"""

[git]
network = true
# GitHub CLI credentials are required for the default private skills source.
# Jbox mounts only ~/.config/gh/hosts.yml, read-only, into the guest.
credentials = "github-cli"

[git.author]
# Read user.name and user.email from the host global Git config without
# mounting it into the guest. Set either key here to override that field.
inherit_host = true
# name = "Your Name"
# email = "you@example.com"
