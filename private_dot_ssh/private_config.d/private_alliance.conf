# Digital Research Alliance of Canada clusters.
#
# These aliases intentionally do not set User or IdentityFile. Use your
# Alliance username at connect time, or add a User line here if it is the same
# across clusters.

Host alliance-* cc-* *.computecanada.ca *.scinet.utoronto.ca
  ServerAliveInterval 60
  ServerAliveCountMax 3
  TCPKeepAlive yes
  ForwardAgent no
  ForwardX11 no
  AddKeysToAgent yes
  ControlMaster auto
  ControlPersist 30m
  ControlPath ~/.ssh/control-%C

Host alliance-rorqual cc-rorqual rorqual
  HostName rorqual

Host alliance-fir cc-fir fir
  HostName fir

Host alliance-nibi cc-nibi nibi
  HostName nibi

Host alliance-narval cc-narval narval
  HostName narval.computecanada.ca

Host alliance-niagara cc-niagara niagara
  HostName niagara.scinet.utoronto.ca
